name = "ridge-to-coast"
main = "workers/index.js"
compatibility_date = "2024-01-01"
account_id = "c378aeb8ad614074b3a5e541a4788993"

# The `DB` binding backs /v1/subscribe. Each environment gets its own database so
# a preview signup can never touch the production list. Create them with:
#   npx wrangler d1 create ridgetocoast-<env>
# then paste the returned id below and apply infra/d1/schema.sql.
#
# NEWSLETTER_API_KEY and IP_HASH_SALT are secrets, set per environment with
# `wrangler secret put --env <env>`, never in this file.

[env.production]
routes = [
  { pattern = "api.ridgetocoast.com/*", zone_name = "ridgetocoast.com" }
]
vars = { SITE_ORIGIN = "https://ridgetocoast.com", MAIL_FROM = "Ridge to Coast <notes@ridgetocoast.com>" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "ridgetocoast-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"

[env.preview]
routes = [
  { pattern = "preprod.ridgetocoast.com/*", zone_name = "ridgetocoast.com" }
]
vars = { SITE_ORIGIN = "https://preprod.ridgetocoast.com", MAIL_FROM = "Ridge to Coast (preprod) <notes@ridgetocoast.com>" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ridgetocoast-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_ID"

[env.alpha]
routes = [
  { pattern = "alpha.ridgetocoast.com/*", zone_name = "ridgetocoast.com" }
]
vars = { SITE_ORIGIN = "https://alpha.ridgetocoast.com", MAIL_FROM = "Ridge to Coast (alpha) <notes@ridgetocoast.com>" }

[[env.alpha.d1_databases]]
binding = "DB"
database_name = "ridgetocoast-alpha"
database_id = "REPLACE_WITH_ALPHA_D1_ID"

# Local development only — `wrangler dev --env dev --local`. Deliberately has no
# `routes`, so it can never be deployed to a hostname. scripts/dev.sh runs it and
# scripts/dev-server.mjs proxies /v1/* to it.
#
# SITE_ORIGIN is unset on purpose: subscribe.js then builds confirmation links
# from the requesting origin, so they point back at the dev server.
[env.dev]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ridgetocoast-dev"
# Ignored by --local, which keeps its SQLite store under .wrangler/.
database_id = "local-development-only"
