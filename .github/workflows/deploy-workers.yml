name: Deploy API (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'app/lib/geo-data-core.js'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, preview, alpha]

permissions:
  contents: read

jobs:
  # Gate every deploy on a green suite. Previously tests and deploy ran
  # concurrently and independently, so a red suite did not stop a release.
  tests:
    uses: ./.github/workflows/test.yml

  deploy-production:
    needs: tests
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage new version (not live until promoted via promote-workers.yml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --env production

      # No smoke test here on purpose: `versions upload` stages a version
      # without serving traffic. The live check runs in promote-workers.yml.

  deploy-preview:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to preprod.ridgetocoast.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env preview

      - name: Smoke test preprod.ridgetocoast.com
        run: ./scripts/smoke-api.sh https://preprod.ridgetocoast.com

  deploy-alpha:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'alpha'
    runs-on: ubuntu-latest
    environment: alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to alpha.ridgetocoast.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env alpha

      - name: Smoke test alpha.ridgetocoast.com
        run: ./scripts/smoke-api.sh https://alpha.ridgetocoast.com
