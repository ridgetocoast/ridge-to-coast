name: Deploy API (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'app/lib/geo-data-core.js'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, preview, alpha]

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage new version (not live until promoted via promote-workers.yml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --env production

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to preprod.ridgetocoast.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env preview

  deploy-alpha:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'alpha'
    runs-on: ubuntu-latest
    environment: alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to alpha.ridgetocoast.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env alpha
