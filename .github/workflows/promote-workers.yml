name: Promote / Rollback Workers API

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options: [promote, rollback]
      environment:
        description: 'Target environment (promote: production only; rollback: any)'
        required: true
        default: 'production'
        type: choice
        options: [production, preview, alpha]
      version_id:
        description: 'Version ID to promote (default: latest uploaded version)'
        required: false
        default: ''

jobs:
  promote:
    # Only production uses `versions upload` staging — preview/alpha deploy directly
    if: inputs.action == 'promote' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `versions deploy --yes` alone selects 0 versions and fails — the version
      # to promote must be passed explicitly as <version-id>@100%.
      - name: Resolve version to promote
        id: version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [ -n "${INPUT_VERSION_ID}" ]; then
            version_id="${INPUT_VERSION_ID}"
          else
            version_id=$(npx wrangler@4 versions list --env production --json \
              | jq -r 'sort_by(.metadata.created_on) | last | .id')
          fi
          if [ -z "${version_id}" ] || [ "${version_id}" = "null" ]; then
            echo "::error::No uploaded version found to promote."
            exit 1
          fi
          echo "Promoting version: ${version_id}"
          echo "id=${version_id}" >> "$GITHUB_OUTPUT"
      - name: Deploy staged version to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 versions deploy "${{ steps.version.outputs.id }}@100%" --env production --yes

  rollback:
    if: inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rollback ${{ inputs.environment }} to previous version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback --env ${{ inputs.environment }} --yes
